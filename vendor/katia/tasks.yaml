analyze_seed_changes:
  description: >
    Analyze the Jira bug report title and description and the seed changes that were made to fix the reported bug.
    Combine this analysis with the initial static impact set, which contains the fully qualified names of code entities that are statically related to the seed changes.
    
    For each entity in the initial static impact set, analyze its relationship to the seed changes and collect evidence indicating whether the entity must be modified as a consequence of the seed changes. 
    Furthermore, identify any additional code entities that must be modified or created and collect supporting evidence.
    
    Focus on production code, not test code or other files.
    
    Inputs:
    - Jira bug report title: {jira_title}
    - Jira bug report description: {jira_description}
    - Seed changes and their Git diff hunks: {seed_changes}
    - Initial static code change impact set: {static_impact_set}

  expected_output: >
    Structured evidence for each entity of the initial static impact set, including:
    - its fully qualified name
    - an assessment of whether it must be modified as a consequence of the seed changes
    - the supporting evidence
    
    Additionally, include any code entities that must be modified or created but are not part of the initial static impact set.

refine_impact_set:
  description: >
    Your task is to refine the initial static impact set.
    
    You are provided with change impact evidence produced by the previous task.
    Use this evidence to decide whether a code entity should be added or removed from the initial static impact set.
    Your goal is to provide a final impact set that consists of the fully qualified names of code entities that must be modified or created because of the seed changes.
    
    - Remove code entities unless the provided evidence indicates that they must be modified.
    - Add code entities that the provided evidence indicates must be modified or created.
    - Remove any seed code entities from the impact set.
    
    Focus on production code, not test code or other files.
    
    Inputs:
    - Initial static code change impact set: {static_impact_set}
    - Seed changes and their Git diff hunks: {seed_changes}
    - Evidence provided by the previous task

  expected_output: >
    A list of the fully qualified names of code entities that must be modified or created because of the seed changes.
    This list must not contain any seed changes or test code entities.

report_final_impact_set:
  description: >
    The previous agent has produced a final impact set.
    Your task is to adapt the format of this final impact set if it does not adhere to the expected output format.
    Never change any of its contents.
    
    Return exactly one valid single-line JSON array of strings.
    Each string must be the fully qualified name of an impacted code entity.
    Do not include any additional text, formatting, or meta-information.

  expected_output: >
    Strictly stick to the expected output format.
    The output must start with [ and end with ].
    Do not use Markdown code fences.
    
    Example output (four impacted code entities):
    ["com.example.Foo.someMethod(java.lang.String, int)", "com.example.bar.attribute1", "com.example.bar.Class.NestedClass", "com.example.bar.Class.Class()"]

    Example output (two impacted code entities):
    ["com.example.package.ParentClass.ChildClass.field", "com.example.package.ParentClass.apply(long, com.example.package.ParentClass)"]

    Example output (zero impacted code entities):
    []